---
name: OBS PR Repair Automation

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      org:
        description: 'GitHub organization to sweep'
        required: false
        default: 'os-autoinst'
        type: string
      repo:
        description: 'Specific repository (e.g. os-autoinst/openQA)'
        required: false
        type: string
      pr:
        description: 'Specific PR number'
        required: false
        type: string
      dry_run:
        description: 'Simulate without modifying state'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [obs-pr-repair]

jobs:
  obs-pr-repair:
    name: Diagnose and repair OBS PR staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: 'pyproject.toml'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osc
      - name: Install python dependencies
        run: uv sync
      - name: Configure osc credentials
        run: |
          mkdir -p ~/.config/osc/
          cat > ~/.config/osc/oscrc <<EOF
          [general]
          apiurl = https://api.opensuse.org/

          [https://api.opensuse.org]
          user = $OSC_USER
          pass = $OSC_PASS
          credentials_mgr_class = osc.credentials.PlaintextConfigFileCredentialsManager
          EOF
        env:
          OSC_USER: ${{ secrets.OSC_USER }}
          OSC_PASS: ${{ secrets.OSC_PASS }}
      - name: Verify script imports
        run: uv run ./obs-pr-repair --help
      - name: Execute OBS PR Repair
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_ACTIONS || secrets.GITHUB_TOKEN }}
          PAYLOAD_ORG: ${{ github.event.client_payload.org }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cmd=(uv run ./obs-pr-repair)
          if [ -n "$PAYLOAD_REPO" ] && [ -n "$PAYLOAD_PR" ]; then
            cmd+=(--repo "$PAYLOAD_REPO" --pr "$PAYLOAD_PR")
          elif [ -n "$INPUT_REPO" ] && [ -n "$INPUT_PR" ]; then
            cmd+=(--repo "$INPUT_REPO" --pr "$INPUT_PR")
          else
            cmd+=(--org "${INPUT_ORG:-${PAYLOAD_ORG:-os-autoinst}}")
          fi
          cmd+=(--auto-repair --comment)
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            cmd+=(--dry-run)
          fi
          "${cmd[@]}"
